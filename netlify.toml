# Netlify Configuration for ExpenseShare AI
# Proxies traffic from Netlify CDN/custom domain to the persistent container backend service

[build]
  publish = "app/static"

# Route all pages and API to the Render backend container with proxy headers
[[redirects]]
  from = "/*"
  to = "https://expenseshare-ai.onrender.com/:splat"
  status = 200
  force = true
  headers = {X-From = "Netlify", X-Forwarded-Host = "expenseshare-ai-vignesh.netlify.app", X-Forwarded-Proto = "https", X-Original-Host = "expenseshare-ai-vignesh.netlify.app"}

