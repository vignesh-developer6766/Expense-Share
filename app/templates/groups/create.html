{% extends "base.html" %}

{% block title %}Create Group — ExpenseShare AI{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-6">
        <div class="card card-custom p-4">
            <h3 class="fw-bold mb-3"><i class="bi bi-folder-plus text-primary me-2"></i>Create New Group</h3>
            <form method="POST" action="{{ url_for('groups.create_group') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">Group Name</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ name or '' }}" required placeholder="e.g. College Trip, Roommates, Goa 2026">
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label fw-semibold">Description (Optional)</label>
                    <textarea class="form-control" id="description" name="description" rows="3" placeholder="What is this group for?">{{ description or '' }}</textarea>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('groups.list_groups') }}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-accent">Create Group</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
