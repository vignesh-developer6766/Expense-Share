{% extends "base.html" %}

{% block title %}Edit {{ group.name }} — ExpenseShare AI{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-6">
        <div class="card card-custom p-4">
            <h3 class="fw-bold mb-3"><i class="bi bi-pencil-square text-primary me-2"></i>Edit Group</h3>
            <form method="POST" action="{{ url_for('groups.edit_group', group_id=group.id) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">Group Name</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ group.name }}" required>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label fw-semibold">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="3">{{ group.description or '' }}</textarea>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('groups.group_detail', group_id=group.id) }}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-accent">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
